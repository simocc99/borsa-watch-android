name: Rilascio

# Crea la pagina "Release" con l'app (APK) e il server per Windows (.exe) da scaricare.
# Si lancia a mano da GitHub (Actions -> Rilascio -> Run workflow) oppure con un tag v*.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numero di versione, es. 1.0.0"
        required: true
        default: "1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Chiave di firma e (se c'è) file Firebase
        env:
          KS: ${{ secrets.BW_KEYSTORE_B64 }}
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/bw.jks"; echo "BW_KEYSTORE=$RUNNER_TEMP/bw.jks" >> "$GITHUB_ENV"; fi
          if [ -n "$GS" ]; then echo "$GS" > android/app/google-services.json; fi
      - name: Compila l'APK
        env:
          BW_KEYSTORE_PASS: ${{ secrets.BW_KEYSTORE_PASS }}
          BW_KEY_ALIAS: borsawatch
          BW_VERSION_CODE: ${{ github.run_number }}
          BW_VERSION_NAME: ${{ inputs.version || github.ref_name }}
        run: gradle --no-daemon assembleRelease
        working-directory: android
      - run: cp android/app/build/outputs/apk/release/app-release.apk BorsaWatch.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: BorsaWatch.apk }

  server:
    name: Server Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r server/requirements-dev.txt
      - name: Prove
        run: python -m pytest -q
        working-directory: server
      - name: Crea BorsaServer.exe
        working-directory: server
        run: >
          pyinstaller --noconfirm --onefile --name BorsaServer
          --collect-all yfinance --collect-all curl_cffi --collect-all certifi --collect-all tzdata
          --collect-all google.auth --collect-all google.oauth2
          run_server.py
      - name: Prova che l'exe parte e risponde
        shell: pwsh
        run: |
          $p = Start-Process server\dist\BorsaServer.exe -ArgumentList '--demo','--port','8799','--data',"$env:RUNNER_TEMP\bwdemo" -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            Start-Sleep 1
            try { $r = Invoke-RestMethod http://127.0.0.1:8799/api/ping; $ok = $r.app -eq 'Borsa Watch' } catch {}
          }
          Stop-Process $p -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw 'BorsaServer.exe non risponde' }
          'BorsaServer.exe risponde correttamente'
      - run: Copy-Item server\dist\BorsaServer.exe BorsaServer.exe
      - uses: actions/upload-artifact@v4
        with: { name: server, path: BorsaServer.exe }

  release:
    name: Pubblica la release
    needs: [apk, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          tag="v${VERSION#v}"
          cp dl/apk/BorsaWatch.apk dl/server/BorsaServer.exe installer/Installa_Server.ps1 installer/Installa_Server.bat installer/Disinstalla_Server.ps1 .
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --title "Borsa Watch $tag" --notes-file docs/NOTE_RELEASE.md \
            BorsaWatch.apk BorsaServer.exe Installa_Server.ps1 Installa_Server.bat Disinstalla_Server.ps1
