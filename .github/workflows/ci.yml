name: Prove

# Repo pubblica: i minuti di GitHub Actions sono gratuiti e illimitati.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: server/requirements-dev.txt }
      - run: pip install -r server/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: server

  android:
    name: App Android (compila e prove)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Compila, prove unitarie, lint
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-report
          path: |
            android/app/build/reports
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  emulator:
    name: Simulazione su telefono virtuale
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: server/requirements.txt }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Avvia il server in modalità demo
        run: |
          pip install -r server/requirements.txt
          cd server
          nohup python -m bwserver --demo --port 8765 --data "$RUNNER_TEMP/bw" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8765/api/ping && break; sleep 1; done
          echo "BW_TOKEN=$(python -c "import json,os;print(json.load(open(os.environ['RUNNER_TEMP']+'/bw/settings.json'))['token'])")" >> "$GITHUB_ENV"
      - name: Prova sull'emulatore (Android 12)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash ci/e2e.sh
        continue-on-error: true
        id: e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-report
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
            shots
          if-no-files-found: ignore
      - name: Log del server
        if: always()
        run: tail -n 60 "$RUNNER_TEMP/server.log" || true
      - name: Esito della simulazione
        if: steps.e2e.outcome != 'success'
        run: |
          echo "La simulazione sull'emulatore è fallita: vedi il report negli artefatti."
          exit 1
